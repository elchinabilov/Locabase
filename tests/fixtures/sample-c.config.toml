# Local Supabase stack — runs on Docker/OrbStack.
# Configuration reference: https://supabase.com/docs/guides/local-development/cli/config
#
# Ports are not the default 543xx: this machine already runs two other local
# Supabase projects (543xx and 553xx). This one sits at **563xx**.
#
# `project_id` is the key that binds containers and volumes — change it and the
# old database is orphaned.
project_id = "sample-c"

[api]
enabled = true
port = 56321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[api.tls]
enabled = false

[db]
port = 56322
shadow_port = 56320
health_timeout = "2m"
# Production (self-hosted) is 17 as well — the two must stay in sync.
major_version = 17

[db.pooler]
enabled = false
port = 56329
pool_mode = "transaction"
default_pool_size = 20
max_client_conn = 100

[db.migrations]
enabled = true
schema_paths = []

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[db.network_restrictions]
enabled = false
allowed_cidrs = ["0.0.0.0/0"]
allowed_cidrs_v6 = ["::/0"]

[realtime]
enabled = true

[studio]
enabled = true
port = 56323
api_url = "http://127.0.0.1"

# Mailpit — mail sent locally never really leaves, it lands in this panel.
[local_smtp]
enabled = true
port = 56324

[storage]
enabled = true
file_size_limit = "50MiB"

# The `photos` bucket is created in the 00001_init.sql migration (together with
# its RLS policies), so it is not repeated here.

[storage.s3_protocol]
enabled = true

[storage.analytics]
enabled = false

[storage.vector]
enabled = false

[auth]
enabled = true
# Web app: the browser origin. In production this is SITE_URL in the server's .env.
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/**"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false
enable_manual_linking = false
minimum_password_length = 8
password_requirements = ""

[auth.rate_limit]
email_sent = 2
sms_sent = 30
anonymous_users = 30
token_refresh = 150
sign_in_sign_ups = 30
token_verifications = 30
web3 = 30

[auth.email]
# The app only uses OAuth; email signup stays on locally for testing.
enable_signup = true
double_confirm_changes = true
enable_confirmations = false
secure_password_change = false
max_frequency = "1s"
otp_length = 6
otp_expiry = 3600

[auth.sms]
enable_signup = false
enable_confirmations = false
template = "Your code is {{ .Code }}"
max_frequency = "5s"

[auth.mfa]
max_enrolled_factors = 10

[auth.mfa.totp]
enroll_enabled = false
verify_enabled = false

[auth.mfa.phone]
enroll_enabled = false
verify_enabled = false
otp_length = 6
template = "Your code is {{ .Code }}"
max_frequency = "5s"

# OAuth providers. Keys are read from the root `.env` file (gitignored) —
# there is deliberately no second `supabase/functions/.env`: one file, one restart.
#
# Google Cloud Console > Credentials > OAuth 2.0 Client (Web):
#   Authorized redirect URI: http://127.0.0.1:56321/auth/v1/callback
[auth.external.google]
enabled = true
client_id = "env(SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_EXTERNAL_GOOGLE_SECRET)"
redirect_uri = ""
url = ""
skip_nonce_check = false
email_optional = false

# GitHub Developer Settings > OAuth Apps:
#   Authorization callback URL: http://127.0.0.1:56321/auth/v1/callback
[auth.external.github]
enabled = true
client_id = "env(SUPABASE_AUTH_EXTERNAL_GITHUB_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_EXTERNAL_GITHUB_SECRET)"
redirect_uri = ""
url = ""
skip_nonce_check = false
email_optional = false

# LinkedIn Developers > App > Auth > "Sign In with LinkedIn using OpenID Connect":
#   Authorized redirect URL: http://127.0.0.1:56321/auth/v1/callback
# Note: the provider name is `linkedin_oidc`, not the old `linkedin` — the login
# page sends this name too (src/app/login/page.tsx).
[auth.external.linkedin_oidc]
enabled = true
client_id = "env(SUPABASE_AUTH_EXTERNAL_LINKEDIN_OIDC_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_EXTERNAL_LINKEDIN_OIDC_SECRET)"
redirect_uri = ""
url = ""
skip_nonce_check = false
email_optional = false

[auth.web3.solana]
enabled = false

[auth.third_party.firebase]
enabled = false

[auth.third_party.auth0]
enabled = false

[auth.third_party.aws_cognito]
enabled = false

[auth.third_party.clerk]
enabled = false

[auth.oauth_server]
enabled = false
authorization_url_path = "/oauth/consent"
allow_dynamic_registration = false

# The project has no edge functions — all backend logic lives in RLS + the Next.js
# server. If you need them, create `supabase/functions/` and enable it here.
[edge_runtime]
enabled = false

# Logflare is the first thing to break locally and we don't need it.
[analytics]
enabled = false
port = 56327
backend = "postgres"

[experimental]
orioledb_version = ""

[experimental.pgdelta]
enabled = true

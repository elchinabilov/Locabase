appId: app.locabase
productName: Locabase
copyright: Copyright © 2025 Elchin Abilov
icon: resources/icon.png
directories:
  buildResources: resources
  output: dist
files:
  - out/**
  - package.json
  - '!**/*.map'
asarUnpack:
  - resources/**
mac:
  category: public.app-category.developer-tools
  target:
    - target: dmg
      arch: [arm64]
  # Signing and notarization come later — local, unsigned builds for now.
  identity: null
  darkModeSupport: true
win:
  target:
    - target: nsis
      arch: [x64]
linux:
  target: [AppImage]
  category: Development
npmRebuild: false

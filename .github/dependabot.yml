version: 2
updates:
  # Electron, pg and dockerode are security-relevant; the rest ride along.
  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      dev-tooling:
        patterns:
          [
            'eslint*',
            '@typescript-eslint/*',
            'typescript-eslint',
            'prettier*',
            'vitest',
            '@vitest/*'
          ]
  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: monthly
